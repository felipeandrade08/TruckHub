name: Repair V13Fixes

on:
  push:
    paths:
      - '.github/workflows/repair-v13fixes.yml'
      - 'desktop/TransPoli/V13Fixes.cs'

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix(build): repair V13Fixes') && !startsWith(github.event.head_commit.message, 'chore(cleanup): remove temporary V13 repair workflow') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair invalid C# escapes
        shell: pwsh
        run: |
          $path = 'desktop/TransPoli/V13Fixes.cs'
          $source = Get-Content $path -Raw
          $oneSlash = [string][char]92
          $twoSlash = $oneSlash + $oneSlash

          $source = $source.Replace('Documents' + $twoSlash + 'Euro Truck Simulator 2' + $twoSlash + 'profiles/steam_profiles', 'Documents/Euro Truck Simulator 2/profiles/steam_profiles')
          $source = $source.Replace('Documents' + $oneSlash + 'Euro Truck Simulator 2' + $oneSlash + 'profiles/steam_profiles', 'Documents/Euro Truck Simulator 2/profiles/steam_profiles')
          $source = $source.Replace('Documents' + $twoSlash + 'American Truck Simulator' + $twoSlash + 'profiles/steam_profiles', 'Documents/American Truck Simulator/profiles/steam_profiles')
          $source = $source.Replace('Documents' + $oneSlash + 'American Truck Simulator' + $oneSlash + 'profiles/steam_profiles', 'Documents/American Truck Simulator/profiles/steam_profiles')
          $source = $source.Replace($twoSlash + 'profiles', '/profiles')
          $source = $source.Replace($oneSlash + 'profiles', '/profiles')
          $source = $source.Replace($twoSlash + 'Euro Truck Simulator 2', '/Euro Truck Simulator 2')
          $source = $source.Replace($oneSlash + 'Euro Truck Simulator 2', '/Euro Truck Simulator 2')
          $source = $source.Replace($twoSlash + 'American Truck Simulator', '/American Truck Simulator')
          $source = $source.Replace($oneSlash + 'American Truck Simulator', '/American Truck Simulator')
          $source = $source.Replace(':' + $oneSlash + 's*', ':' + $twoSlash + 's*')

          Set-Content -Path $path -Value $source -Encoding UTF8

      - name: Commit repair and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/TransPoli/V13Fixes.cs
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'No repair changes detected' }
          git commit -m 'fix(build): repair V13Fixes C# escapes'
          git push

          git rm .github/workflows/repair-v13fixes.yml
          git commit -m 'chore(cleanup): remove temporary V13 repair workflow'
          git push
