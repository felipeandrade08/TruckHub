name: Publish TransPoli Stable Release

on:
  workflow_run:
    workflows:
      - Build TransPoli Desktop
    types:
      - completed

permissions:
  contents: write
  actions: read

env:
  GH_REPO: ${{ github.repository }}

concurrency:
  group: transpoli-stable-release
  cancel-in-progress: true

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n ' < VERSION)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versão inválida em VERSION: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing TransPoli $VERSION from $GITHUB_SHA"

      - name: Download successful desktop build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh run download "${{ github.event.workflow_run.id }}"             --repo "$GH_REPO"             --name TransPoli-Desktop             --dir release-assets
          test -f release-assets/TransPoli-Setup.exe

      - name: Generate release manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          HASH=$(sha256sum release-assets/TransPoli-Setup.exe | awk '{print toupper($1)}')
          URL="https://github.com/${GH_REPO}/releases/download/${TAG}/TransPoli-Setup.exe"
          cat > release-assets/manifest.json <<EOF
          {
            "version": "${VERSION}",
            "channel": "stable",
            "downloadUrl": "${URL}",
            "checksumSha256": "${HASH}",
            "mandatory": false,
            "changelog": "TransPoli ${VERSION} — cockpit moderno, mercado de cargas, recuperação de viagem e economia.",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "author": "Felipe Andrade"
          }
          EOF
          cat release-assets/manifest.json

      - name: Recreate stable release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          TARGET_SHA="${{ github.event.workflow_run.head_sha }}"

          gh release delete "$TAG" --repo "$GH_REPO" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG"             --repo "$GH_REPO"             --target "$TARGET_SHA"             --title "TransPoli Desktop $VERSION"             --generate-notes

          for ATTEMPT in 1 2 3 4 5; do
            echo "Uploading installer + manifest (attempt $ATTEMPT/5)..."
            if gh release upload "$TAG"               release-assets/TransPoli-Setup.exe               release-assets/manifest.json               --repo "$GH_REPO"               --clobber; then
              break
            fi
            if [ "$ATTEMPT" -eq 5 ]; then
              echo "Failed to upload release assets after 5 attempts."
              exit 1
            fi
            sleep 5
          done

          echo "TransPoli $VERSION published successfully."
