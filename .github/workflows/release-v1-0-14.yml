name: Publish TruckHub V1.0.14

on:
  workflow_run:
    workflows: ["Build TransPoli Desktop"]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(tr -d '\r\n ' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION"

      - name: Download successful desktop build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh run download "${{ github.event.workflow_run.id }}" --repo "${{ github.repository }}" --name TransPoli-Desktop --dir release-assets
          test -f release-assets/TransPoli-Setup.exe

      - name: Create V1.0.14 tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git tag -a "$TAG" -m "TruckHub Desktop $TAG"
            git push origin "$TAG"
          fi

      - name: Publish V1.0.14 and remove obsolete releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes >/dev/null 2>&1 || true
          gh release create "$TAG" release-assets/TransPoli-Setup.exe --repo "${{ github.repository }}" --title "TruckHub Desktop $VERSION" --generate-notes

          for OLD_TAG in v1.0.13 v1.0.12 v1.0.11 v1.0.10 v1.0.9 v1.0.8 v1.0.7 v1.0.6 v1.0.5 v1.0.4 v1.0.3 v1.0.2 v1.0.1; do
            if [ "$OLD_TAG" != "$TAG" ]; then
              echo "Removing obsolete release $OLD_TAG"
              gh release delete "$OLD_TAG" --repo "${{ github.repository }}" --yes >/dev/null 2>&1 || true
              git push origin --delete "$OLD_TAG" >/dev/null 2>&1 || true
            fi
          done

          echo "V1.0.14 published successfully."
