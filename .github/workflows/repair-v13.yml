name: Repair V1.0.13 source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, 'Repair V1.0.13 source') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Repair malformed regex literal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('desktop/TransPoli/V13Fixes.cs')
          s = p.read_text(encoding='utf-8')
          old = r'''var m = Regex.Match(string.Join("\\n", block), $@"\\b{Regex.Escape(key)}\\s*:\\s*(?:\\\"(?<q>[^\\\"]*)\\\"|(?<v>[^\\s}}]+))", RegexOptions.IgnoreCase);'''
          new = r'''var source = string.Join("\\n", block); var pattern = "\\\\b" + Regex.Escape(key) + "\\\\s*:\\s*(?:\\\"(?<q>[^\\\"]*)\\\"|(?<v>[^\\\\s}]+))"; var m = Regex.Match(source, pattern, RegexOptions.IgnoreCase);'''
          if old in s:
              s = s.replace(old, new, 1)
          else:
              s = s.replace('string Field(string key){var m=Regex.Match(string.Join("\\n",block),$@"\\b{Regex.Escape(key)}\\s*:\\s*(?:\\"(?<q>[^\\"]*)\\"|(?<v>[^\\s}}]+))",RegexOptions.IgnoreCase);return m.Success?(m.Groups["q"].Success?m.Groups["q"].Value:m.Groups["v"].Value):"";}', 'string Field(string key){var source=string.Join("\\n",block);var pattern="\\\\b"+Regex.Escape(key)+"\\\\s*:\\s*(?:\\"(?<q>[^\\"]*)\\"|(?<v>[^\\\\s}]+))";var m=Regex.Match(source,pattern,RegexOptions.IgnoreCase);return m.Success?(m.Groups["q"].Success?m.Groups["q"].Value:m.Groups["v"].Value):"";}')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop/TransPoli/V13Fixes.cs
          git diff --cached --quiet || git commit -m 'Repair V1.0.13 source regex syntax'
          git push
