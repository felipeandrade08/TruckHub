name: Build TransPoli Desktop
# Release v1.0.27: build from main also publishes the installer assets.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - chatgpt/app-stabilization-ui
    tags:
      - 'v*'
    paths:
      - 'VERSION'
      - 'desktop/**'
      - 'desktop/installer/**'
      - '.github/workflows/build-desktop.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'VERSION'
      - 'desktop/**'
      - 'desktop/installer/**'

permissions:
  contents: write

concurrency:
  group: transpoli-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $versionFile = 'VERSION'
          if (-not (Test-Path $versionFile)) { throw 'Arquivo VERSION não encontrado.' }
          $v = (Get-Content $versionFile -Raw).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Versão inválida em VERSION: $v" }
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v?\d+\.\d+\.\d+$') {
            $tagVersion = $tag.TrimStart('v')
            if ($tagVersion -ne $v) { throw "VERSION ($v) não corresponde à tag ($tagVersion)." }
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Versao do build: $v"

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/artifacts/TransPoli-package | Out-Null
          Remove-Item desktop/artifacts/TransPoli-Setup.exe -Force -ErrorAction SilentlyContinue

      - name: Verify source prerequisites
        shell: pwsh
        run: |
          $required = @(
            'desktop/TransPoli/TransPoli.csproj',
            'desktop/TransPoli/TabletPhaseJ.cs'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Arquivo obrigatório não encontrado: $path" }
          }
          Write-Host 'Código-fonte pronto para compilação; nenhum arquivo é alterado pelo workflow.'

      - name: Publish TransPoli
        shell: pwsh
        run: |
          dotnet publish desktop/TransPoli/TransPoli.csproj -c Release -r win-x64 --self-contained true -o desktop/artifacts/TransPoli-package -p:Version=${{ steps.version.outputs.version }} -p:AssemblyVersion=${{ steps.version.outputs.version }}.0 -p:FileVersion=${{ steps.version.outputs.version }}.0 *>&1 | Tee-Object -FilePath publish-transpoli.log

      - name: Upload publish diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transpoli-publish-log
          path: publish-transpoli.log

      - name: Prepare SCS SDK headers for VehicleControl
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'scs-sdk-plugin.zip'
          $src = Join-Path $env:RUNNER_TEMP 'scs-sdk-plugin-src'
          Invoke-WebRequest -Uri 'https://codeload.github.com/RenCloud/scs-sdk-plugin/zip/refs/heads/master' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $src -Force
          $sdk = Get-ChildItem $src -Directory | Select-Object -First 1
          if (-not $sdk) { throw 'SCS SDK archive could not be expanded.' }
          Copy-Item (Join-Path $sdk.FullName 'scs_sdk') 'scs-sdk' -Recurse
          if (-not (Test-Path 'scs-sdk/include/scssdk_input.h')) { throw 'SCS input headers not found.' }
          if (-not (Test-Path 'scs-sdk/include/scssdk_telemetry.h')) { throw 'SCS telemetry headers not found.' }

      - name: Build production VehicleControl plugin
        shell: pwsh
        run: |
          cmake -S desktop/TransPoli.VehicleControl -B desktop/TransPoli.VehicleControl/build -A x64 -DSCS_SDK_INCLUDE_DIR="$PWD/scs-sdk/include"
          cmake --build desktop/TransPoli.VehicleControl/build --config Release
          $dll = Get-ChildItem desktop/TransPoli.VehicleControl/build -Recurse -Filter 'TransPoli.VehicleControl.dll' | Select-Object -First 1
          if (-not $dll) { throw 'TransPoli.VehicleControl.dll nao foi gerada.' }
          $pluginDir = 'desktop/artifacts/TransPoli-package/ETS2Plugin'
          New-Item -ItemType Directory -Force -Path $pluginDir | Out-Null
          Copy-Item $dll.FullName "$pluginDir/TransPoli.VehicleControl.dll" -Force
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'Visual Studio C++ tools nao encontrados.' }
          $dumpbin = Get-ChildItem "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -File | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe nao encontrado.' }
          $exports = & $dumpbin.FullName /exports $dll.FullName | Out-String
          foreach ($export in @('scs_input_init','scs_input_shutdown','scs_telemetry_init','scs_telemetry_shutdown')) {
            if ($exports -notmatch "(?m)\b$export\b") { throw "VehicleControl sem export obrigatorio: $export" }
          }
          Write-Host 'VehicleControl de producao validado e incluido no Desktop novo.'

      - name: Build isolated ETS2 AutoStart plugin
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'Visual Studio C++ tools nao encontrados para AutoStart.' }
          $msbuild = Get-ChildItem "$vsPath\MSBuild\Current\Bin\MSBuild.exe" -File | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild.exe nao encontrado para AutoStart.' }
          & $msbuild.FullName desktop/TransPoliAutoStart/TransPoliAutoStart.vcxproj /p:Configuration=Release /p:Platform=x64 /m
          if ($LASTEXITCODE -ne 0) { throw "Build do TransPoli.AutoStart falhou com codigo $LASTEXITCODE." }
          $dll = Get-ChildItem desktop/TransPoliAutoStart -Recurse -Filter 'TransPoli.AutoStart.dll' | Select-Object -First 1
          if (-not $dll) { throw 'TransPoli.AutoStart.dll nao foi gerada.' }
          $pluginDir = 'desktop/artifacts/TransPoli-package/ETS2Plugin'
          New-Item -ItemType Directory -Force -Path $pluginDir | Out-Null
          Copy-Item $dll.FullName "$pluginDir/TransPoli.AutoStart.dll" -Force
          $dumpbin = Get-ChildItem "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -File | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe nao encontrado para AutoStart.' }
          $exports = & $dumpbin.FullName /exports $dll.FullName | Out-String
          foreach ($export in @('scs_telemetry_init','scs_telemetry_shutdown')) {
            if ($exports -notmatch "(?m)\b$export\b") { throw "AutoStart sem export obrigatorio: $export" }
          }
          Write-Host 'AutoStart isolado validado e incluido no pacote ETS2Plugin.'

      - name: Restore and build connector
        shell: pwsh
        run: |
          dotnet restore desktop/TransPoliConnector/TransPoliConnector.csproj
          dotnet build desktop/TransPoliConnector/TransPoliConnector.csproj -c Release --no-restore
          if (-not (Test-Path 'desktop/TransPoliConnector/bin/Release/net48/TransPoliConnector.exe')) { throw 'TransPoliConnector.exe não foi gerado.' }
          Copy-Item desktop/TransPoliConnector/bin/Release/net48/TransPoliConnector.exe desktop/artifacts/TransPoli-package/TransPoliConnector.exe -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' /DMyAppVersion=${{ steps.version.outputs.version }} desktop/installer/TransPoli.iss
          if (-not (Test-Path 'desktop/artifacts/TransPoli-Setup.exe')) { throw 'TransPoli-Setup.exe não foi gerado.' }

      - name: Generate update manifest
        id: manifest
        shell: pwsh
        run: |
          $tag = 'v${{ steps.version.outputs.version }}'
          $installer = 'desktop/artifacts/TransPoli-Setup.exe'
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/TransPoli-Setup.exe"
          $notes = "${{ github.event.head_commit.message }}"
          if ([string]::IsNullOrWhiteSpace($notes)) { $notes = "Atualizacao $tag do TransPoli." }
          $manifest = [ordered]@{
            version        = "${{ steps.version.outputs.version }}"
            channel        = 'stable'
            downloadUrl    = $url
            checksumSha256 = $hash
            mandatory      = $false
            changelog      = $notes
            publishedAt    = (Get-Date).ToUniversalTime().ToString('o')
            author         = 'Felipe Andrade'
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Path desktop/artifacts/manifest.json -Encoding UTF8
          Get-Content desktop/artifacts/manifest.json

      - name: Publish stable GitHub Release
        # Durante a estabilização, o instalador testado precisa ser exatamente o
        # mesmo SHA compilado pelo workflow do PR/branch, evitando baixar release antiga.
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'v${{ steps.version.outputs.version }}'
          $installer = 'desktop/artifacts/TransPoli-Setup.exe'
          $manifest = 'desktop/artifacts/manifest.json'
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            # Recria a release estável inteira. Isso evita assets órfãos/stale que
            # podem aparecer no gh release view mas falhar no delete/upload por ID.
            gh release delete $tag --repo "${{ github.repository }}" --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw "Falha ao remover release estável antiga $tag." }
            gh release create $tag $installer $manifest --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "TransPoli Desktop $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Falha ao recriar release $tag." }
          } else {
            gh release create $tag $installer $manifest --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "TransPoli Desktop $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Falha ao criar release $tag." }
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TransPoli-Desktop
          path: desktop/artifacts/TransPoli-Setup.exe

      - name: Upload matching VehicleControl DLL
        uses: actions/upload-artifact@v4
        with:
          name: TransPoli-VehicleControl-DLL
          path: desktop/artifacts/TransPoli-package/ETS2Plugin/TransPoli.VehicleControl.dll
          if-no-files-found: error

      - name: Upload exact new Desktop publish package
        uses: actions/upload-artifact@v4
        with:
          name: TransPoli-New-Desktop-Package
          path: desktop/artifacts/TransPoli-package
          if-no-files-found: error
