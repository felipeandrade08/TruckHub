name: Build TransPoli Labs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-labs:
    runs-on: windows-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build experimental TransPoli Desktop integration
        shell: pwsh
        run: |
          dotnet publish desktop/TransPoli/TransPoli.csproj -c Release -r win-x64 --self-contained true -o artifacts/TransPoli-vehicle-control-lab -p:Version=1.0.32 -p:AssemblyVersion=1.0.32.0 -p:FileVersion=1.0.32.0
          if (-not (Test-Path 'artifacts/TransPoli-vehicle-control-lab/TransPoli.exe')) { throw 'Experimental TransPoli Desktop build was not generated.' }

      - name: Prepare SCS SDK headers
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'scs-sdk-plugin.zip'
          $src = Join-Path $env:RUNNER_TEMP 'scs-sdk-plugin-src'
          Invoke-WebRequest -Uri 'https://codeload.github.com/RenCloud/scs-sdk-plugin/zip/refs/heads/master' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $src -Force
          $sdk = Get-ChildItem $src -Directory | Select-Object -First 1
          if (-not $sdk) { throw 'SCS SDK archive could not be expanded.' }
          Copy-Item (Join-Path $sdk.FullName 'scs_sdk') 'scs-sdk' -Recurse
          if (-not (Test-Path 'scs-sdk/include/scssdk_input.h')) { throw 'SCS SDK input headers not found.' }
          if (-not (Test-Path 'scs-sdk/include/scssdk_telemetry.h')) { throw 'SCS SDK telemetry headers not found.' }

      - name: Build VehicleControlLab DLL
        shell: pwsh
        run: |
          cmake -S labs/TransPoli.VehicleControlLab -B labs/TransPoli.VehicleControlLab/build -A x64 -DSCS_SDK_INCLUDE_DIR="$PWD/scs-sdk/include"
          cmake --build labs/TransPoli.VehicleControlLab/build --config Release
          $dll = Get-ChildItem labs/TransPoli.VehicleControlLab/build -Recurse -Filter 'TransPoli.VehicleControlLab.dll' | Select-Object -First 1
          if (-not $dll) { throw 'VehicleControlLab DLL was not generated.' }
          New-Item -ItemType Directory -Force -Path artifacts/VehicleControlLab | Out-Null
          Copy-Item $dll.FullName artifacts/VehicleControlLab/
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'Visual Studio C++ tools installation was not found.' }
          $dumpbin = Get-ChildItem "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -File |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe was not found in the Visual Studio C++ tools installation.' }
          $exports = & $dumpbin.FullName /exports $dll.FullName | Out-String
          if ($exports -notmatch '(?m)\bscs_input_init\b') { throw 'VehicleControlLab missing export: scs_input_init' }
          if ($exports -notmatch '(?m)\bscs_input_shutdown\b') { throw 'VehicleControlLab missing export: scs_input_shutdown' }
          Write-Host 'VehicleControlLab SCS exports validated.'

      - name: Build VehicleControlLab controller
        shell: pwsh
        run: |
          dotnet publish labs/TransPoli.VehicleControlLab/controller/TransPoli.VehicleControlLab.Controller.csproj -c Release -r win-x64 --self-contained true -o artifacts/VehicleControlLab/controller
          if (-not (Test-Path 'artifacts/VehicleControlLab/controller/TransPoli.VehicleControlLab.Controller.exe')) { throw 'VehicleControlLab controller was not generated.' }

      - name: Build BrakeLab DLL
        shell: pwsh
        run: |
          cmake -S labs/TransPoli.BrakeLab -B labs/TransPoli.BrakeLab/build -A x64 -DSCS_SDK_INCLUDE_DIR="$PWD/scs-sdk/include"
          cmake --build labs/TransPoli.BrakeLab/build --config Release
          $dll = Get-ChildItem labs/TransPoli.BrakeLab/build -Recurse -Filter 'TransPoli.BrakeLab.dll' | Select-Object -First 1
          if (-not $dll) { throw 'BrakeLab DLL was not generated.' }
          New-Item -ItemType Directory -Force -Path artifacts/BrakeLab | Out-Null
          Copy-Item $dll.FullName artifacts/BrakeLab/
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'Visual Studio C++ tools installation was not found.' }
          $dumpbin = Get-ChildItem "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -File |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe was not found in the Visual Studio C++ tools installation.' }
          $exports = & $dumpbin.FullName /exports $dll.FullName | Out-String
          if ($exports -notmatch '(?m)\bscs_telemetry_init\b') { throw 'BrakeLab missing export: scs_telemetry_init' }
          if ($exports -notmatch '(?m)\bscs_telemetry_shutdown\b') { throw 'BrakeLab missing export: scs_telemetry_shutdown' }
          Write-Host 'BrakeLab SCS exports validated.'

      - name: Write test instructions
        shell: pwsh
        run: |
          @'
          TRANSPOLI LABS - TESTE EXPERIMENTAL

          VehicleControlLab:
          - DLL em ETS2/bin/win_x64/plugins
          - Execute o Controller fora do ETS2
          - R = REQUEST LOCK / U = UNLOCK / S = STATUS / Q = UNLOCK + sair
          - REQUEST LOCK pode ser feito em movimento; deve permanecer LOCK_PENDING
          - O bloqueio fisico so pode ocorrer depois do SAFE_STOP

          BrakeLab:
          - DLL em ETS2/bin/win_x64/plugins
          - Primeira fase e observacional: temperatura, pedal e freio efetivo
          - O fade ainda nao e aplicado ao jogo nesta compilacao

          A v1.0.32 nao e alterada por este workflow.
          '@ | Set-Content artifacts/LEIA-ME-TESTE.txt -Encoding UTF8

      - name: Upload experimental TransPoli Desktop integration
        uses: actions/upload-artifact@v4
        with:
          name: TransPoli-Desktop-VehicleControlLab-Test
          path: artifacts/TransPoli-vehicle-control-lab

      - name: Upload VehicleControlLab
        uses: actions/upload-artifact@v4
        with:
          name: TransPoli-VehicleControlLab-Test
          path: artifacts/VehicleControlLab

      - name: Upload BrakeLab
        uses: actions/upload-artifact@v4
        with:
          name: TransPoli-BrakeLab-Test
          path: artifacts/BrakeLab

      - name: Upload instructions
        uses: actions/upload-artifact@v4
        with:
          name: TransPoli-Labs-Instructions
          path: artifacts/LEIA-ME-TESTE.txt
