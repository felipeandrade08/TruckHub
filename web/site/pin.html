<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#02080f">
  <title>Seu PIN | TransPoli</title>
  <link rel="icon" href="assets/brand/icons/favicon.ico" sizes="any"><link rel="icon" href="assets/brand/icons/icon-192.png" type="image/png"><link rel="apple-touch-icon" href="assets/brand/icons/apple-touch-icon.png"><link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="brand.css"><link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-bg"></div>
    <a class="auth-logo" href="index.html"><img src="assets/brand/transpoli-logo.png" alt="TransPoli"></a>
    <main class="auth-card">
      <div class="auth-kicker">ATIVAÇÃO DO COMPUTADOR DE BORDO</div>
      <h1>Seu PIN TransPoli.</h1>
      <p>Guarde este PIN. Ele será usado para ativar o TransPoli no seu computador.</p>
      <div style="margin:28px 0;padding:24px;border:1px solid rgba(255,152,0,.35);border-radius:16px;text-align:center;background:rgba(255,152,0,.07)">
        <small style="display:block;color:#8F9CAB;letter-spacing:.16em;margin-bottom:10px">PIN DE ATIVAÇÃO</small>
        <strong id="pin" style="font-size:42px;letter-spacing:.22em;color:#ffc41f">------</strong>
      </div>
      <p id="pinEmail" style="font-size:13px"></p>
      <a class="back" href="login.html">Ir para o login →</a>
    </main>
  </div>
  <script>
    const pin = sessionStorage.getItem('transpoli_new_pin');
    const email = sessionStorage.getItem('transpoli_new_email');
    document.getElementById('pin').textContent = pin || '------';
    document.getElementById('pinEmail').textContent = email ? `Conta criada para ${email}` : 'O PIN só é exibido nesta etapa.';
  </script>
</body>
</html>
