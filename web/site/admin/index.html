<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>TransPoli Admin Center</title><style>:root{--bg:#02080f;--p:#0a1a2b;--p2:#10263c;--line:#1b3550;--text:#f5f7fa;--muted:#8f9cab;--a:#ffc41f;--bad:#ff5d6c;--ok:#42e59a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui}main{max-width:1500px;margin:auto;padding:28px}.panel,.card{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:20px}.login{max-width:420px;margin:12vh auto}input,button{width:100%;padding:11px;margin:7px 0;border-radius:8px;border:1px solid #1b3550;background:var(--p2);color:#fff}button{background:var(--a);color:#111;font-weight:700;cursor:pointer}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.value{font-size:24px;font-weight:800;margin-top:7px}.muted{color:var(--muted)}.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:20px}.table{overflow:auto;margin-top:20px}table{width:100%;border-collapse:collapse;min-width:900px}td,th{padding:10px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar input{max-width:420px}.error{color:var(--bad)}.tabs{display:flex;gap:8px;overflow:auto;margin:20px 0}.tabs button{width:auto;white-space:nowrap;background:var(--p2);color:var(--text)}.tabs button.active{background:var(--a);color:#111}.danger{background:transparent;border-color:var(--bad);color:var(--bad)}@media(max-width:850px){.grid{grid-template-columns:2fr 2fr}.toolbar{flex-direction:column;align-items:stretch}}</style><link rel="icon" href="../assets/brand/icons/favicon.ico" sizes="any"><link rel="icon" href="../assets/brand/icons/icon-192.png" type="image/png"><link rel="apple-touch-icon" href="../assets/brand/icons/apple-touch-icon.png"><link rel="stylesheet" href="../brand.css"></head><body><main><section id="login" class="panel login"><h1>TransPoli Admin Center</h1><p class="muted">Área administrativa protegida.</p><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Senha"><button id="enter">Entrar</button><p id="error" class="error"></p></section><section id="app" class="hidden"><div class="bar"><div><h1>TransPoli Admin Center</h1><span class="muted">Operação completa do TransPoli</span></div><button id="logout" style="max-width:120px">Sair</button></div><div id="stats" class="grid"></div><div class="tabs"><button data-tab="users" class="active">Usuários</button><button data-tab="payments">Pagamentos</button><button data-tab="trips">Viagens</button><button data-tab="devices">Dispositivos</button><button data-tab="sessions">Sessões</button><button data-tab="audit">Auditoria</button></div><section id="users" class="panel tab"><div class="toolbar"><h2 style="margin:0;flex:1">Usuários</h2><input id="filter" placeholder="Buscar por nome ou e-mail"></div><div class="table" id="usersTable"></div></section><section id="payments" class="panel tab hidden"><h2>Pagamentos</h2><div class="table" id="paymentsTable"></div></section><section id="trips" class="panel tab hidden"><h2>Viagens</h2><div class="table" id="tripsTable"></div></section><section id="devices" class="panel tab hidden"><h2>Dispositivos</h2><div class="table" id="devicesTable"></div></section><section id="sessions" class="panel tab hidden"><h2>Sessões</h2><div class="table" id="sessionsTable"></div></section><section id="audit" class="panel tab hidden"><h2>Auditoria administrativa</h2><div class="table" id="auditTable"></div></section></section></main><script>const API='https://api.transpoli.com.br',q=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let userRows=[];function csrf(){const m=document.cookie.match(/(?:^|;\s*)transpoli_admin_csrf=([^;]+)/);return m?decodeURIComponent(m[1]):''}async function req(p,o={}){const headers={'Content-Type':'application/json',...(o.headers||{})};if(o.method&&o.method!=='GET')headers['X-TransPoli-Admin-CSRF']=csrf();const r=await fetch(API+p,{...o,credentials:'include',headers});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erro');return d}function rowsTable(id,head,rows){q('#'+id).innerHTML='<table><tr>'+head.map(x=>`<th>${x}</th>`).join('')+'</tr>'+rows.join('')+'</table>'}function renderUsers(){const f=q('#filter').value.trim().toLowerCase();const rows=userRows.filter(x=>(x.name+' '+x.email).toLowerCase().includes(f));rowsTable('usersTable',['Nome','E-mail','Status','Licença','Expiração','Ação'],rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.status)}</td><td>${esc(x.license_type)} / ${esc(x.license_status)}</td><td>${esc(x.expires_at)}</td><td><button onclick="openUser('${x.id}')">Abrir</button></td></tr>`))}async function load(){const [d,u,a,p,t,dev,s]=await Promise.all([req('/admin/dashboard'),req('/admin/users'),req('/admin/audit'),req('/admin/payments'),req('/admin/trips'),req('/admin/devices'),req('/admin/sessions')]);userRows=u.users;q('#stats').innerHTML=[['Usuários',d.users.total],['Ativos',d.users.active],['Trial',d.licenses.trial],['Lifetime',d.licenses.lifetime],['Bloqueados',d.users.blocked],['Viagens',d.trips.total],['Pagamentos aprovados',d.payments.approved],['Receita','R$ '+Number(d.payments.revenue||0).toFixed(2)]].map(x=>`<div class="card"><span class="muted">${x[0]}</span><div class="value">${esc(x[1])}</div></div>`).join('');renderUsers();rowsTable('paymentsTable',['Usuário','Valor','Status','Mercado Pago','ID externo','Pago em'],p.payments.map(x=>`<tr><td>${esc(x.name)}<br><span class="muted">${esc(x.email)}</span></td><td>R$ ${Number(x.amount||0).toFixed(2)}</td><td>${esc(x.status)} / ${esc(x.provider_status)}</td><td>${esc(x.status_detail)}</td><td>${esc(x.external_id)}</td><td>${esc(x.paid_at)}</td></tr>`));rowsTable('tripsTable',['Usuário','Carga','Origem','Destino','Distância','Valor','Status'],t.trips.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.cargo)}</td><td>${esc(x.origin)}</td><td>${esc(x.destination)}</td><td>${esc(x.distance_km)} km</td><td>R$ ${Number(x.cargo_value_brl||0).toFixed(2)}</td><td>${esc(x.status)}</td></tr>`));rowsTable('devicesTable',['Usuário','Device ID','Status','Ativado','Revogado','Licença'],dev.devices.map(x=>`<tr><td>${esc(x.name)}<br>${esc(x.email)}</td><td>${esc(x.device_id)}</td><td>${esc(x.status)}</td><td>${esc(x.activated_at)}</td><td>${esc(x.revoked_at)}</td><td>${esc(x.license_type)} / ${esc(x.license_status)}</td></tr>`));rowsTable('sessionsTable',['Usuário','Tipo','Device','Criada','Último uso','Expira','Status'],s.sessions.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.session_type)}</td><td>${esc(x.device_id)}</td><td>${esc(x.created_at)}</td><td>${esc(x.last_seen_at)}</td><td>${esc(x.expires_at)}</td><td>${x.revoked_at?'revogada':'ativa'}</td></tr>`));rowsTable('auditTable',['Data','Ação','Alvo','Detalhes'],a.logs.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.action)}</td><td>${esc(x.target_type)} ${esc(x.target_id)}</td><td>${esc(JSON.stringify(x.detail))}</td></tr>`))}function openUser(id){location.href='usuario.html?id='+encodeURIComponent(id)}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));b.classList.add('active');q('#'+b.dataset.tab).classList.remove('hidden')});q('#filter').oninput=renderUsers;q('#enter').onclick=async()=>{try{await req('/admin/auth/login',{method:'POST',body:JSON.stringify({email:q('#email').value,password:q('#password').value})});q('#login').classList.add('hidden');q('#app').classList.remove('hidden');load()}catch(e){q('#error').textContent=e.message}};q('#logout').onclick=async()=>{await req('/admin/auth/logout',{method:'POST'});location.reload()};async function keepAdminSession(){try{await req('/admin/me')}catch{location.reload()}}req('/admin/me').then(()=>{q('#login').classList.add('hidden');q('#app').classList.remove('hidden');load();setInterval(keepAdminSession,20*60*1000)}).catch(()=>{});</script></body></html>
