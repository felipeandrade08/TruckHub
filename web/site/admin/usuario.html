<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>TruckHub Admin — Usuário</title><style>:root{--bg:#02080f;--p:#0a1a2b;--p2:#10263c;--line:#1b3550;--text:#f5f7fa;--muted:#8f9cab;--a:#ffc41f;--ok:#42e59a;--bad:#ff5d6c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui}main{max-width:1400px;margin:auto;padding:26px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.top h1{margin:0 0 5px}.muted{color:var(--muted)}.panel,.card{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:18px}.search{display:flex;gap:10px}.search input{flex:1}input,button{border:1px solid var(--line);background:var(--p2);color:var(--text);padding:10px 12px;border-radius:8px}button{cursor:pointer;font-weight:700}.primary{background:var(--a);color:#111}.danger{border-color:var(--bad);color:var(--bad)}.ok{border-color:var(--ok);color:var(--ok)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.value{font-size:20px;font-weight:800;margin-top:7px}.section{margin-top:18px}.section h2{font-size:16px}.table{overflow:auto;border:1px solid var(--line);border-radius:10px}.table table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{width:auto}.hidden{display:none}.error{color:var(--bad)}.back{background:transparent}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.search{flex-direction:column}}</style><link rel="icon" href="../assets/brand/icons/favicon.ico" sizes="any"><link rel="icon" href="../assets/brand/icons/icon-192.png" type="image/png"><link rel="apple-touch-icon" href="../assets/brand/icons/apple-touch-icon.png"><link rel="stylesheet" href="../brand.css"></head><body><main><div class="top"><div><h1>Usuário</h1><div id="subtitle" class="muted">Consulta administrativa</div></div><div class="actions"><button class="back" onclick="location.href='index.html'">Voltar</button><button class="back" onclick="logout()">Sair</button></div></div><section class="panel"><div class="search"><input id="userId" placeholder="UUID do usuário"><button class="primary" onclick="loadUser()">Buscar</button></div><p id="error" class="error"></p></section><div id="content" class="hidden"><div id="stats" class="grid"></div><section class="section panel"><h2>Dados da conta</h2><div id="user"></div></section><section class="section panel"><h2>Licenças</h2><div id="licenses" class="table"></div></section><section class="section panel"><h2>Dispositivos</h2><div id="devices" class="table"></div></section><section class="section panel"><h2>Sessões</h2><div id="sessions" class="table"></div></section><section class="section panel"><h2>Viagens recentes</h2><div id="trips" class="table"></div></section></div></main><script>const API='https://api.truckhub.com.br',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function csrf(){const m=document.cookie.match(/(?:^|;\s*)truckhub_admin_csrf=([^;]+)/);return m?decodeURIComponent(m[1]):''}async function req(p,o={}){const headers={'Content-Type':'application/json',...(o.headers||{})};if(o.method&&o.method!=='GET')headers['X-TruckHub-Admin-CSRF']=csrf();const r=await fetch(API+p,{...o,credentials:'include',headers});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erro');return d}function table(id,head,rows){document.getElementById(id).innerHTML=rows.length?'<table><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+rows.join('')+'</table>':'<div style="padding:14px" class="muted">Nenhum registro.</div>'}async function loadUser(){const id=document.getElementById('userId').value.trim();if(!id)return;try{const d=await req('/admin/users/'+encodeURIComponent(id));const u=d.user;document.getElementById('content').classList.remove('hidden');document.getElementById('subtitle').textContent=u.name+' · '+u.email;document.getElementById('user').innerHTML=`<b>${esc(u.name)}</b><br><span class="muted">${esc(u.email)} · ${esc(u.status)} · criado em ${esc(u.created_at)}</span><div class="actions" style="margin-top:12px"><button class="${u.status==='blocked'?'ok':'danger'}" onclick="userStatus('${u.id}','${u.status}')">${u.status==='blocked'?'Ativar usuário':'Bloquear usuário'}</button><button class="danger" onclick="revokeAll('${u.id}')">Encerrar todas as sessões</button><button class="danger" onclick="softDelete('${u.id}')">Excluir conta</button></div>`;document.getElementById('stats').innerHTML=[['Licenças',d.licenses.length],['Dispositivos',d.devices.length],['Sessões',d.sessions.length],['Viagens',d.trips.length]].map(x=>`<div class="card"><span class="muted">${x[0]}</span><div class="value">${x[1]}</div></div>`).join('');table('licenses',['Tipo','Status','Expiração','Criada','Ações'],d.licenses.map(x=>`<tr><td>${esc(x.license_type)}</td><td>${esc(x.status)}</td><td>${esc(x.expires_at)}</td><td>${esc(x.created_at)}</td><td><div class="actions"><button class="ok" onclick="licenseAction('${x.id}','lifetime')">Lifetime</button><button onclick="licenseAction('${x.id}','trial')">Reset Trial</button><button class="danger" onclick="licenseAction('${x.id}','revoke')">Bloquear</button></div></td></tr>`));table('devices',['Device ID','Status','Ativado','Revogado','Ação'],d.devices.map(x=>`<tr><td>${esc(x.device_id)}</td><td>${esc(x.status)}</td><td>${esc(x.activated_at)}</td><td>${esc(x.revoked_at)}</td><td>${x.status==='active'?`<button class="danger" onclick="revokeDevice('${x.id}')">Desativar</button>`:'—'}</td></tr>`));table('sessions',['Tipo','Criada','Expira','Último uso','Revogada','Ação'],d.sessions.map(x=>`<tr><td>${esc(x.session_type)}</td><td>${esc(x.created_at)}</td><td>${esc(x.expires_at)}</td><td>${esc(x.last_seen_at)}</td><td>${esc(x.revoked_at)}</td><td>${!x.revoked_at?`<button class="danger" onclick="revokeSession('${x.id}')">Encerrar</button>`:'—'}</td></tr>`));table('trips',['Carga','Origem','Destino','Início','Fim','Status'],d.trips.map(x=>`<tr><td>${esc(x.cargo)}</td><td>${esc(x.origin)}</td><td>${esc(x.destination)}</td><td>${esc(x.started_at)}</td><td>${esc(x.finished_at)}</td><td>${esc(x.status)}</td></tr>`))}catch(e){document.getElementById('error').textContent=e.message}}async function userStatus(id,status){const next=status==='blocked'?'active':'blocked';if(!confirm(`Confirmar ${next==='blocked'?'bloqueio':'ativação'} deste usuário?`))return;await req('/admin/users/'+id+'/status',{method:'POST',body:JSON.stringify({status:next})});loadUser()}async function revokeAll(id){if(!confirm('Encerrar todas as sessões deste usuário?'))return;await req('/admin/users/'+id+'/revoke-sessions',{method:'POST'});loadUser()}async function softDelete(id){if(!confirm('Excluir esta conta? A exclusão é lógica e as sessões serão encerradas.'))return;await req('/admin/users/'+id+'/delete',{method:'POST'});loadUser()}async function licenseAction(id,action){const labels={lifetime:'liberar lifetime',trial:'resetar para trial',revoke:'bloquear'};if(!confirm('Confirmar '+labels[action]+'?'))return;const path=action==='lifetime'?'lifetime':action==='trial'?'trial':'revoke';await req('/admin/licenses/'+id+'/'+path,{method:'POST'});loadUser()}async function revokeDevice(id){if(!confirm('Desativar este dispositivo? As sessões desktop vinculadas serão encerradas.'))return;await req('/admin/devices/'+id+'/revoke',{method:'POST'});loadUser()}async function revokeSession(id){if(!confirm('Encerrar esta sessão do usuário?'))return;await req('/admin/sessions/'+id+'/revoke',{method:'POST'});loadUser()}async function logout(){await req('/admin/auth/logout',{method:'POST'});location.href='index.html'}const id=new URLSearchParams(location.search).get('id');if(id){document.getElementById('userId').value=id;req('/admin/me').then(()=>{loadUser();setInterval(()=>req('/admin/me').catch(()=>location.href='index.html'),20*60*1000)}).catch(()=>location.href='index.html')}</script></body></html>
