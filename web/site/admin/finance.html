<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>TruckHub — Auditoria Financeira</title>
  <style>
    :root{color-scheme:dark;--bg:#02080f;--panel:#0a1a2b;--panel2:#10263c;--line:#1b3550;--text:#f5f7fa;--muted:#8f9cab;--accent:#ffc41f;--ok:#42e59a;--bad:#ff5d6c}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}h1{margin:0;font-size:24px}.muted{color:var(--muted)}button,input{border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);padding:10px 12px}button{cursor:pointer;background:var(--accent);color:#111;font-weight:700}.danger{background:transparent;color:var(--bad);border-color:var(--bad)}.login,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}.login{max-width:460px;margin:10vh auto}.login input{width:100%;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat strong{display:block;font-size:22px;margin-top:6px}.section{margin-top:24px}.section h2{font-size:17px}.table{overflow:auto;border:1px solid var(--line);border-radius:12px}.table table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{color:var(--muted);font-size:12px}.ok{color:var(--ok)}.bad{color:var(--bad)}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.hidden{display:none!important}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
  </style>
<link rel="icon" href="../assets/brand/icons/favicon.ico" sizes="any"><link rel="icon" href="../assets/brand/icons/icon-192.png" type="image/png"><link rel="apple-touch-icon" href="../assets/brand/icons/apple-touch-icon.png"><link rel="stylesheet" href="../brand.css"></head>
<body>
<main>
  <section id="login" class="login">
    <h1>TruckHub Admin</h1>
    <p class="muted">Auditoria financeira interna. Esta área não faz parte do painel do cliente.</p>
    <input id="secret" type="password" autocomplete="current-password" placeholder="Chave administrativa">
    <button id="enter">Entrar</button>
    <p id="loginError" class="bad"></p>
  </section>

  <section id="app" class="hidden">
    <div class="top"><div><h1>Auditoria Financeira</h1><div class="muted">Mercado Pago · pagamentos · webhooks · reconciliação</div></div><button id="logout" class="danger">Sair</button></div>
    <div class="grid" id="stats"></div>
    <section class="section card"><div class="toolbar"><button id="refresh">Atualizar</button><span id="updated" class="muted"></span></div></section>
    <section class="section"><h2>Possíveis problemas</h2><div id="problems" class="table"></div></section>
    <section class="section"><h2>Pagamentos recentes</h2><div id="payments" class="table"></div></section>
    <section class="section"><h2>Webhooks</h2><div id="webhooks" class="table"></div></section>
    <section class="section"><h2>Reconciliações</h2><div id="runs" class="table"></div></section>
  </section>
</main>
<script>
const API='https://api.truckhub.com.br';const KEY='truckhub_admin_secret';
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function secret(){return sessionStorage.getItem(KEY)||''}
async function request(path){const r=await fetch(API+path,{headers:{Authorization:'Bearer '+secret(),Accept:'application/json'},cache:'no-store'});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Falha administrativa');return data}
function table(target,headers,rows){$(target).innerHTML=rows.length?'<table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table>':'<div style="padding:18px" class="muted">Nenhum registro.</div>'}
function showApp(){ $('login').classList.add('hidden');$('app').classList.remove('hidden');load() }
async function load(){try{const [o,p,w,r]=await Promise.all([request('/internal/admin/finance/overview'),request('/internal/admin/finance/payments?limit=50'),request('/internal/admin/finance/webhooks?limit=50'),request('/internal/admin/finance/reconciliation')]);const s=o.summary||{};$('stats').innerHTML=[['Aprovados',s.approved_count||0],['Receita aprovada','R$ '+Number(s.approved_amount||0).toFixed(2)],['Pendentes',s.pending_count||0],['Falhos',s.failed_count||0],['Inconsistentes',s.inconsistent_count||0]].map(x=>`<div class="card stat"><span class="muted">${x[0]}</span><strong>${esc(x[1])}</strong></div>`).join('');table('problems',['Pagamento','Usuário','Problema','Valor','Criado'],(o.problems||[]).map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.user_id)}</td><td class="bad">${esc(x.problem)}</td><td>R$ ${Number(x.amount||0).toFixed(2)}</td><td>${esc(x.created_at)}</td></tr>`));table('payments',['Data','Status','Valor','External ID','Referência','Licença'],(p.payments||[]).map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.status)}</td><td>R$ ${Number(x.amount||0).toFixed(2)}</td><td>${esc(x.external_id)}</td><td>${esc(x.external_reference)}</td><td>${esc(x.license_type)} / ${esc(x.license_status)}</td></tr>`));table('webhooks',['Recebido','Evento','Pagamento','Resultado','Erro'],(w.webhooks||[]).map(x=>`<tr><td>${esc(x.received_at)}</td><td>${esc(x.event_type)} / ${esc(x.action)}</td><td>${esc(x.payment_id)}</td><td>${esc(x.result)}</td><td class="bad">${esc(x.error_detail)}</td></tr>`));table('runs',['Início','Fim','Status','Lidos','Corrigidos','Falhas','Erro'],(r.runs||[]).map(x=>`<tr><td>${esc(x.started_at)}</td><td>${esc(x.finished_at)}</td><td>${esc(x.status)}</td><td>${esc(x.scanned_count)}</td><td class="ok">${esc(x.repaired_count)}</td><td class="bad">${esc(x.failed_count)}</td><td>${esc(x.error_detail)}</td></tr>`));$('updated').textContent='Atualizado em '+new Date().toLocaleString('pt-BR')}catch(e){$('loginError').textContent=e.message;if(e.message.includes('autorizado'))logout()}}
function logout(){sessionStorage.removeItem(KEY);location.reload()}
$('enter').onclick=async()=>{const v=$('secret').value.trim();if(!v)return;$('loginError').textContent='';sessionStorage.setItem(KEY,v);try{await request('/internal/admin/finance/overview');showApp()}catch(e){sessionStorage.removeItem(KEY);$('loginError').textContent=e.message}}
$('refresh').onclick=load;$('logout').onclick=logout;if(secret())showApp();
</script>
</body>
</html>
