<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#02080f">
  <title>Entrar | TransPoli</title>
  <link rel="icon" href="assets/brand/icons/favicon.ico" sizes="any"><link rel="icon" href="assets/brand/icons/icon-192.png" type="image/png"><link rel="apple-touch-icon" href="assets/brand/icons/apple-touch-icon.png"><link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="brand.css"><link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-bg"></div>
    <a class="auth-logo" href="index.html"><img src="assets/brand/transpoli-logo.png" alt="TransPoli"></a>
    <main class="auth-card">
      <div class="auth-kicker">ÁREA DO MOTORISTA</div>
      <h1>Bem-vindo de volta.</h1>
      <p>Entre na sua conta para acessar suas viagens, caminhões, relatórios e licença TransPoli.</p>
      <div class="auth-message" data-auth-message hidden></div>
      <form data-login-form>
        <label>E-mail<input name="email" type="email" placeholder="seu@email.com" autocomplete="email" required></label>
        <label>Senha<input name="password" type="password" placeholder="Sua senha" autocomplete="current-password" required></label>
        <div class="form-row"><label class="check"><input name="remember" type="checkbox"> Lembrar de mim</label><a href="recuperar-senha.html">Esqueci minha senha</a></div>
        <button type="submit">Entrar <span>→</span></button>
      </form>
      <div class="divider"><span>OU</span></div>
      <p class="bottom">Ainda não possui uma conta? <a href="cadastro.html">Criar conta grátis</a></p>
      <a class="back" href="index.html">← Voltar para o TransPoli</a>
    </main>
  </div>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="session-restore.js"></script>
</body>
</html>
